apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-scripts
  namespace: device-management
data:
  01_create_database.sql: |
    IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'DeviceManagementDB')
    BEGIN
        CREATE DATABASE DeviceManagementDB;
    END
    GO

  02_create_tables.sql: |
    USE DeviceManagementDB;
    GO

    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'Users')
    BEGIN
        CREATE TABLE Users (
            Id INT IDENTITY(1,1),
            CONSTRAINT PK_Users PRIMARY KEY (Id),
            Name NVARCHAR(100) NOT NULL,
            Role NVARCHAR(50) NOT NULL,
            Location NVARCHAR(100) NOT NULL,
            Email NVARCHAR(150) NOT NULL,
            CONSTRAINT UQ_Users_Email UNIQUE (Email),
            PasswordHash NVARCHAR(255) NOT NULL
        );
    END
    GO

    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'Devices')
    BEGIN
        CREATE TABLE Devices (
            Id INT IDENTITY(1,1),
            CONSTRAINT PK_Devices PRIMARY KEY (Id),
            Name NVARCHAR(100) NOT NULL,
            Manufacturer NVARCHAR(100) NOT NULL,
            Type NVARCHAR(50) NOT NULL,
            OS NVARCHAR(50) NOT NULL,
            OSVersion NVARCHAR(50),
            Processor NVARCHAR(100),
            RAM NVARCHAR(50),
            Description NVARCHAR(500),
            AssignedUserId INT NULL,
            CONSTRAINT FK_Devices_Users FOREIGN KEY (AssignedUserId)
                REFERENCES Users(Id)
                ON DELETE SET NULL
        );
    END
    GO

  03_populate_database.sql: |
    USE DeviceManagementDB;
    GO

    DELETE FROM Devices;
    DELETE FROM Users;

    DBCC CHECKIDENT ('Users', RESEED, 0);
    DBCC CHECKIDENT ('Devices', RESEED, 0);

