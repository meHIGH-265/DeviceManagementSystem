apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default

  source:
    repoURL: https://github.com/meHIGH-265/DeviceManagementSystem
    targetRevision: main
    path: k8s/database

  destination:
    server: https://kubernetes.default.svc
    namespace: device-management

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
