apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: device-management-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/meHIGH-265/DeviceManagementSystem
    targetRevision: main
    path: Infrastructure/Applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
